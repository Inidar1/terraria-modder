name: Bug Report
description: Report a TerrariaModder Core, public Debug Tools, or released-mod problem
labels: ["bug"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod or component?
      options:
        - Core / Framework
        - Admin Panel
        - Auto Furniture Buffs
        - Biome Spread Control
        - Public Debug Tools
        - FPS Unlocked
        - Item Spawner
        - Pet Chests
        - Quick Keys
        - Randomizer
        - Seed Lab
        - Skip Intro
        - Storage Hub
        - Whip Stacking
        - Other / Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Core and mod version
      description: Check the Mod Menu (F6) or the session log.
      placeholder: "Example: Core 0.4.0, Storage Hub 2.0.0"
    validations:
      required: true

  - type: input
    id: terraria-version
    attributes:
      label: Terraria version
      placeholder: "1.4.5.8"
    validations:
      required: true

  - type: dropdown
    id: game-mode
    attributes:
      label: Game mode
      options:
        - Singleplayer
        - Host & Play host
        - Host & Play client
        - Dedicated server
        - Dedicated-server client
        - Title screen / startup
    validations:
      required: true

  - type: textarea
    id: enabled-mods
    attributes:
      label: Enabled mods
      description: List every enabled TerrariaModder mod, including versions when known.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest repeatable sequence.
      placeholder: |
        1. Launch through TerrariaInjector.exe
        2. Open a character and world
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Session log
      description: Attach or paste relevant lines from the newest terrariamodder.client.session-*.log or terrariamodder.server.session-*.log under Terraria/TerrariaModder/core/logs/.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Add focused game-window evidence when the problem is visible.
