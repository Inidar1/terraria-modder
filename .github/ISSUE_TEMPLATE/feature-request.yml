name: Feature Request
description: Suggest a TerrariaModder improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod or component?
      options:
        - Core / Framework
        - Admin Panel
        - Auto Furniture Buffs
        - Biome Spread Control
        - Public Debug Tools
        - FPS Unlocked
        - Item Spawner
        - Pet Chests
        - Quick Keys
        - Randomizer
        - Seed Lab
        - Skip Intro
        - Storage Hub
        - Whip Stacking
        - New mod idea
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the behavior or workflow you want.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: Explain the problem this would solve.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing Terraria or mod behavior that is close.
